<div class="file-preview">
  <button type="button" class="file-preview-picker" (click)="openFilePicker()"><i class="fas fa-folder-open"></i> {{ label }}</button>
  <input #fileInput class="file-preview-input" type="file" [accept]="accept" [multiple]="maxFiles > 1" (change)="onInput($event)">
  <small class="file-preview-help">{{ accept || 'Semua tipe file' }} · maksimal {{ maxSizeMb }} MB<span *ngIf="maxFiles > 1"> · {{ maxFiles }} file</span></small>
  <p class="file-preview-error" *ngIf="error" role="alert"><i class="fas fa-circle-exclamation"></i> {{ error }}</p>
  <div class="file-preview-list" *ngIf="previews.length">
    <article class="file-preview-item" *ngFor="let preview of previews; let i = index">
      <button type="button" class="file-preview-remove" (click)="remove(i)" title="Hapus file"><i class="fas fa-times"></i></button>
      <button type="button" class="file-preview-image-button" *ngIf="preview.kind === 'image'" (click)="openImage(preview.url)" title="Perbesar gambar"><img [src]="preview.url" [alt]="preview.file.name"></button>
      <iframe *ngIf="preview.kind === 'pdf'" [src]="preview.safeUrl" title="Preview PDF"></iframe>
      <div class="file-preview-generic" *ngIf="preview.kind === 'generic'"><i class="fas" [ngClass]="icon(preview.file)"></i></div>
      <div class="file-preview-meta"><strong [title]="preview.file.name">{{ preview.file.name }}</strong><span>{{ fileSize(preview.file) }} · {{ preview.file.type || 'Tipe tidak diketahui' }}</span></div>
    </article>
  </div>
</div>
<div class="file-preview-lightbox" *ngIf="enlargedUrl" (click)="closeImage()" role="dialog" aria-label="Preview gambar"><button type="button" (click)="closeImage()" aria-label="Tutup"><i class="fas fa-times"></i></button><img [src]="enlargedUrl" alt="Gambar diperbesar" (click)="$event.stopPropagation()"></div>
