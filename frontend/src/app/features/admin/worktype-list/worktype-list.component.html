<div class="dashboard-container admin-theme">
  <app-admin-sidebar></app-admin-sidebar>

  <div class="main-content">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Manajemen Tipe Kerja</h2>
      <button class="btn-primary" (click)="openAddModal()">+ Tambah Tipe Kerja</button>
    </div>

    <div class="golan-card">
      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
      
      <div class="table-container">
        <table *ngIf="!isLoading && workTypes.length > 0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nama Tipe Kerja</th>
              <th>Geofence Rumah (IsHomeBase)</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let wt of workTypes">
              <td>{{ wt.ID }}</td>
              <td style="font-weight: 500;">{{ wt.Nama }}</td>
              <td>
                <span class="status-badge" [ngClass]="wt.IsHomeBase ? 'status-hadir' : 'status-alpha'">
                  {{ wt.IsHomeBase ? 'Ya (Cek Lokasi Rumah)' : 'Tidak (Cek Lokasi Kantor/Bypass)' }}
                </span>
              </td>
              <td>
                <button class="btn-edit" (click)="openEditModal(wt)">Edit</button>
                <button class="btn-delete" (click)="deleteWorkType(wt.ID)">Hapus</button>
              </td>
            </tr>
          </tbody>
        </table>

        <div *ngIf="isLoading" class="loading-state">
          Memuat data...
        </div>

        <div *ngIf="!isLoading && workTypes.length === 0" class="empty-state">
          Belum ada tipe kerja.
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Dialog -->
<div class="modal-overlay" *ngIf="isModalOpen">
  <div class="modal-content golan-card" style="max-width: 400px;">
    <div class="modal-header">
      <h3>{{ isEditMode ? 'Edit Tipe Kerja' : 'Tambah Tipe Kerja' }}</h3>
      <button class="btn-close" (click)="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <form (ngSubmit)="saveWorkType()">
        <div class="form-group">
          <label>Nama Tipe Kerja</label>
          <input type="text" [(ngModel)]="formData.Nama" name="nama" required class="form-control" placeholder="Contoh: WFO, WFH, Dinas Luar" />
        </div>
        
        <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 15px;">
          <input type="checkbox" [(ngModel)]="formData.IsHomeBase" name="isHomeBase" id="isHomeBase" style="width: auto;" />
          <label for="isHomeBase" style="margin: 0; font-weight: normal; cursor: pointer;">
            Validasi koordinat rumah (Is Home Base)
          </label>
        </div>

        <div class="modal-footer" style="margin-top: 25px;">
          <button type="button" class="btn-secondary" (click)="closeModal()">Batal</button>
          <button type="submit" class="btn-primary" [disabled]="isSaving || !formData.Nama">{{ isSaving ? 'Menyimpan...' : 'Simpan' }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
