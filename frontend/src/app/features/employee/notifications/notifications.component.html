<div class="dashboard-container">
  <app-shared-sidebar></app-shared-sidebar>

  <main class="main-content">
    <div class="header notification-header">
      <div>
        <h2>Notifikasi</h2>
        <p class="subtitle">Informasi terbaru terkait absensi dan pengajuan Anda.</p>
      </div>
      <button class="btn-secondary" type="button" (click)="markAllAsRead()" [disabled]="unreadCount === 0">
        Tandai semua dibaca
      </button>
    </div>

    <div class="notification-toolbar golan-card">
      <button type="button" [class.active]="filterMode === 'all'" (click)="filterMode = 'all'">Semua</button>
      <button type="button" [class.active]="filterMode === 'unread'" (click)="filterMode = 'unread'">Belum dibaca ({{ unreadCount }})</button>
    </div>

    <div class="golan-card notification-list">
      <div *ngIf="isLoading" class="state-message">Memuat notifikasi...</div>
      <div *ngIf="!isLoading && filteredNotifications.length === 0" class="state-message">
        Tidak ada notifikasi untuk ditampilkan.
      </div>
      <button class="notification-item" type="button" *ngFor="let notif of filteredNotifications" [class.unread]="!notif.StatusBaca" (click)="markAsRead(notif)">
        <span class="notification-dot" [class.visible]="!notif.StatusBaca"></span>
        <span class="notification-copy">
          <strong>{{ notif.Judul }}</strong>
          <span>{{ notif.Pesan }}</span>
          <small>{{ notif.Waktu | date:'dd MMM yyyy, HH:mm' }}</small>
        </span>
      </button>
    </div>
  </main>
</div>
