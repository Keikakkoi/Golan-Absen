<div class="dashboard-container">
  <app-shared-sidebar></app-shared-sidebar>
  <main class="main-content">
    <section class="golan-card team-report-card">
      <div class="team-filter-layout">
        <div class="team-filter-heading"><h2>Absensi Tim</h2><p>Status kehadiran anggota tim berdasarkan tanggal.</p></div>
        <div class="report-toolbar team-attendance-toolbar">
          <label>Nama/NIK<input class="golan-input" [(ngModel)]="search"></label>
          <label>Tanggal<input type="date" class="golan-input" [(ngModel)]="date"></label>
          <label>Status<select class="golan-input" [(ngModel)]="status"><option value="">Semua status</option><option>Hadir</option><option>Terlambat</option><option>Tidak hadir</option></select></label>
          <button type="button" class="btn-primary report-filter-action" (click)="load()">Tampilkan</button>
          <div class="export-dropdown">
            <button type="button" class="btn btn-secondary" (click)="toggleExportDropdown()"><i class="fas fa-file-export" aria-hidden="true"></i> Unduh / Cetak <i class="fas fa-chevron-down" aria-hidden="true"></i></button>
            <div class="dropdown-menu-custom" *ngIf="isExportOpen">
              <button type="button" class="dropdown-item" (click)="exportCSV()"><i class="fas fa-file-csv"></i> Format CSV</button>
              <button type="button" class="dropdown-item" (click)="exportExcel()"><i class="fas fa-file-excel"></i> Format Excel (XLS)</button>
              <button type="button" class="dropdown-item" (click)="exportJSON()"><i class="fas fa-file-code"></i> Format JSON</button>
              <button type="button" class="dropdown-item" (click)="exportPDF()"><i class="fas fa-file-pdf"></i> Format PDF</button>
            </div>
          </div>
        </div>
      </div>
      <p class="alert alert-danger" *ngIf="error">{{ error }}</p>
      <div class="golan-table-responsive"><table class="golan-table"><thead><tr><th>Nama</th><th>Tanggal</th><th>Status</th><th>Masuk</th><th>Pulang</th></tr></thead><tbody><tr *ngFor="let row of displayedRows"><td>{{ row.nama }}</td><td>{{ row.tanggal }}</td><td><span *ngIf="!row.checkout_missing" class="status-pill" [class.status-terlambat]="row.status === 'Terlambat'">{{ row.status }}</span><span *ngIf="row.checkout_missing" class="status-pill status-warning">⚠ Belum Check-out</span></td><td>{{ row.jam_masuk || '-' }}</td><td>{{ row.jam_pulang || '-' }}</td></tr></tbody></table></div>
      <app-pagination [totalItems]="totalItems" [currentPage]="page" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions" [loading]="isLoading" (pageChange)="pageChanged($event)" (pageSizeChange)="pageSizeChanged($event)"></app-pagination>
      <p *ngIf="!rows.length && !isLoading" class="muted">Belum ada anggota tim yang terhubung.</p>
    </section>
  </main>
</div>
