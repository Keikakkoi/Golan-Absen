<div class="dashboard-container"><app-shared-sidebar></app-shared-sidebar><main class="main-content"><div class="header"><h2>Absensi Tim</h2><p>Status kehadiran anggota tim berdasarkan tanggal.</p></div><section class="golan-card"><div class="report-toolbar"><label>Nama/NIK<input class="golan-input" [(ngModel)]="search"></label><label>Tanggal<input type="date" class="golan-input" [(ngModel)]="date"></label><label>Status<select class="golan-input" [(ngModel)]="status"><option value="">Semua status</option><option>Hadir</option><option>Terlambat</option><option>Tidak hadir</option></select></label><button type="button" class="btn-primary report-filter-action" (click)="load()">Tampilkan</button><div class="export-dropdown" style="position: relative;"><button type="button" class="btn btn-secondary" (click)="toggleExportDropdown()"><i class="fas fa-file-export" style="margin-right: 0.5rem;"></i> Unduh / Cetak <i class="fas fa-chevron-down" style="margin-left: 0.5rem; font-size: 0.8rem;"></i></button><div class="dropdown-menu-custom" *ngIf="isExportOpen"><button type="button" class="dropdown-item" (click)="exportCSV()"><i class="fas fa-file-csv" style="color: #17a2b8; margin-right: 0.5rem; width: 16px;"></i> Format CSV</button><button type="button" class="dropdown-item" (click)="exportExcel()"><i class="fas fa-file-excel" style="color: #28a745; margin-right: 0.5rem; width: 16px;"></i> Format Excel (XLS)</button><button type="button" class="dropdown-item" (click)="exportJSON()"><i class="fas fa-file-code" style="color: #ffc107; margin-right: 0.5rem; width: 16px;"></i> Format JSON</button><button type="button" class="dropdown-item" (click)="exportPDF()"><i class="fas fa-file-pdf" style="color: #dc3545; margin-right: 0.5rem; width: 16px;"></i> Format PDF</button></div></div></div><p class="alert alert-danger" *ngIf="error">{{ error }}</p><div class="golan-table-responsive"><table class="golan-table"><thead><tr><th>Nama</th><th>Tanggal</th><th>Status</th><th>Masuk</th><th>Pulang</th></tr></thead><tbody><tr *ngFor="let row of rows"><td>{{ row.nama }}</td><td>{{ row.tanggal }}</td><td><span *ngIf="!row.checkout_missing" class="status-pill" [class.status-terlambat]="row.status === 'Terlambat'">{{ row.status }}</span><span *ngIf="row.checkout_missing" class="status-pill status-warning">⚠ Belum Check-out</span></td><td>{{ row.jam_masuk || '-' }}</td><td>{{ row.jam_pulang || '-' }}</td></tr></tbody></table></div><p *ngIf="!rows.length" class="muted">Belum ada anggota tim yang terhubung.</p></section></main></div>
