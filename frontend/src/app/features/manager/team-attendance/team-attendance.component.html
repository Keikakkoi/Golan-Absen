<div class="dashboard-container">
  <app-shared-sidebar></app-shared-sidebar>
  <main class="main-content">
    <div class="header">
      <h2>Absensi Tim</h2>
      <p>Status kehadiran anggota tim berdasarkan rentang tanggal.</p>
    </div>
    <section class="golan-card team-report-card">
      <div class="team-filter-layout">
        <div class="report-toolbar team-attendance-toolbar">
          <label>Nama/NIK<input class="golan-input" [(ngModel)]="search"></label>
          <label>Dari tanggal<input type="date" lang="id" class="golan-input" [(ngModel)]="startDate" [max]="endDate || null" aria-label="Dari tanggal"></label>
          <label>Sampai tanggal<input type="date" lang="id" class="golan-input" [(ngModel)]="endDate" [min]="startDate || null" aria-label="Sampai tanggal"></label>
          <label>Status<select class="golan-input" [(ngModel)]="status"><option value="">Semua status</option><option>Hadir</option><option>Terlambat</option><option value="Tidak hadir">Alpha</option></select></label>
          <button type="button" class="btn-primary report-filter-action" (click)="load()">Filter</button>
          <div class="export-dropdown">
            <button type="button" class="btn btn-secondary" cdkOverlayOrigin #exportTrigger="cdkOverlayOrigin" (click)="toggleExportDropdown()" [attr.aria-expanded]="isExportOpen"><i class="fas fa-file-export" aria-hidden="true"></i> Unduh / Cetak <i class="fas fa-chevron-down" aria-hidden="true"></i></button>
          </div>
          <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="exportTrigger" [cdkConnectedOverlayOpen]="isExportOpen" [cdkConnectedOverlayPositions]="exportDropdownPositions" [cdkConnectedOverlayPush]="true" [cdkConnectedOverlayFlexibleDimensions]="false" [cdkConnectedOverlayViewportMargin]="8" cdkConnectedOverlayPanelClass="team-attendance-export-overlay-pane">
            <div class="dropdown-menu-custom team-attendance-export-menu" role="menu">
              <button type="button" class="dropdown-item" role="menuitem" (click)="exportCSV()"><i class="fas fa-file-csv export-icon export-icon-csv" aria-hidden="true"></i> Format CSV</button>
              <button type="button" class="dropdown-item" role="menuitem" (click)="exportExcel()"><i class="fas fa-file-excel export-icon export-icon-excel" aria-hidden="true"></i> Format Excel (XLS)</button>
              <button type="button" class="dropdown-item" role="menuitem" (click)="exportJSON()"><i class="fas fa-file-code export-icon export-icon-json" aria-hidden="true"></i> Format JSON</button>
              <button type="button" class="dropdown-item" role="menuitem" (click)="exportPDF()"><i class="fas fa-file-pdf export-icon export-icon-pdf" aria-hidden="true"></i> Format PDF</button>
              <button type="button" class="dropdown-item dropdown-item-print" role="menuitem" (click)="printReport()"><i class="fas fa-print export-icon export-icon-print" aria-hidden="true"></i> Cetak Laporan</button>
            </div>
          </ng-template>
        </div>
      </div>
      <p class="alert alert-danger" *ngIf="error" role="alert">{{ error }}</p>
      <div class="golan-table-responsive"><table class="golan-table team-attendance-table"><thead><tr><th>Nama</th><th>Tanggal</th><th>Status</th><th>Masuk</th><th>Pulang</th></tr></thead><tbody><tr *ngFor="let row of displayedRows"><td>{{ row.nama }}</td><td>{{ row.tanggal }}</td><td class="status-cell"><span *ngIf="!row.checkout_missing" class="status-pill" [ngClass]="statusClass(row.status)">{{ statusLabel(row.status) }}</span><span *ngIf="row.checkout_missing" class="status-pill status-warning">Belum Check-out</span></td><td>{{ row.jam_masuk || '-' }}</td><td>{{ row.jam_pulang || '-' }}</td></tr></tbody></table></div>
      <app-pagination (click)="$event.stopPropagation()" [totalItems]="totalItems" [currentPage]="page" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions" [loading]="isLoading" (pageChange)="pageChanged($event)" (pageSizeChange)="pageSizeChanged($event)"></app-pagination>
      <p *ngIf="!rows.length && !isLoading" class="muted">Belum ada anggota tim yang terhubung.</p>
    </section>
  </main>
</div>
