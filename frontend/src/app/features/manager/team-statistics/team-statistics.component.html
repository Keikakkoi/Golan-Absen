<div class="dashboard-container"><app-shared-sidebar></app-shared-sidebar><main class="main-content"><div class="header"><h2>Statistik Kehadiran Tim</h2><p>Grafik kehadiran dan keterlambatan per anggota tim.</p></div><section class="golan-card"><div class="report-toolbar"><label>Mulai<input type="date" class="golan-input" [(ngModel)]="start"></label><label>Selesai<input type="date" class="golan-input" [(ngModel)]="end"></label><button type="button" class="btn-primary report-filter-action" (click)="load()">Filter</button><div class="export-dropdown"><button type="button" class="btn-secondary" (click)="toggleExportDropdown()" [attr.aria-expanded]="isExportOpen"><i class="fas fa-file-export" aria-hidden="true"></i> Unduh / Cetak <i class="fas fa-chevron-down" aria-hidden="true"></i></button><div class="dropdown-menu-custom" *ngIf="isExportOpen"><button type="button" class="dropdown-item" (click)="exportCSV()"><i class="fas fa-file-csv" aria-hidden="true"></i> Format CSV</button><button type="button" class="dropdown-item" (click)="exportExcel()"><i class="fas fa-file-excel" aria-hidden="true"></i> Format Excel (XLS)</button><button type="button" class="dropdown-item" (click)="exportJSON()"><i class="fas fa-file-code" aria-hidden="true"></i> Format JSON</button><button type="button" class="dropdown-item" (click)="exportPDF()"><i class="fas fa-file-pdf" aria-hidden="true"></i> Format PDF</button></div></div></div><div class="member-chart"><div class="member-row" *ngFor="let member of data.members"><strong>{{ member.Name }}</strong><div class="bar-line"><span class="present" [style.width.%]="member.Total ? (member.Hadir / member.Total) * 100 : 0"></span><span class="late" [style.width.%]="member.Total ? (member.Terlambat / member.Total) * 100 : 0"></span></div><small>{{ member.Hadir }} hadir · {{ member.Terlambat }} terlambat</small></div></div></section></main></div>
