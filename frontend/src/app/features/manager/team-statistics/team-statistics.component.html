<div class="dashboard-container"><app-shared-sidebar></app-shared-sidebar><main class="main-content"><div class="header"><h2>Statistik Kehadiran Tim</h2><p>Grafik kehadiran per anggota tim.</p></div><section class="golan-card team-statistics-card"><div class="report-toolbar team-statistics-toolbar"><label>Mulai<input type="date" class="golan-input" [(ngModel)]="start"></label><label>Selesai<input type="date" class="golan-input" [(ngModel)]="end"></label><button type="button" class="btn-primary report-filter-action" (click)="load()">Filter</button><div class="export-dropdown" style="position: relative;"><button type="button" class="btn btn-secondary" (click)="toggleExportDropdown()"><i class="fas fa-file-export" style="margin-right: 0.5rem;"></i> Unduh / Cetak <i class="fas fa-chevron-down" style="margin-left: 0.5rem; font-size: 0.8rem;"></i></button><div class="dropdown-menu-custom" *ngIf="isExportOpen"><button type="button" class="dropdown-item" (click)="exportCSV()"><i class="fas fa-file-csv" style="color: #17a2b8; margin-right: 0.5rem; width: 16px;"></i> Format CSV</button><button type="button" class="dropdown-item" (click)="exportExcel()"><i class="fas fa-file-excel" style="color: #28a745; margin-right: 0.5rem; width: 16px;"></i> Format Excel (XLS)</button><button type="button" class="dropdown-item" (click)="exportJSON()"><i class="fas fa-file-code" style="color: #ffc107; margin-right: 0.5rem; width: 16px;"></i> Format JSON</button><button type="button" class="dropdown-item" (click)="exportPDF()"><i class="fas fa-file-pdf" style="color: #dc3545; margin-right: 0.5rem; width: 16px;"></i> Format PDF</button></div></div></div><div class="member-chart"><div class="member-row" *ngFor="let member of data.members"><strong>{{ member.Name }}</strong><div class="bar-line"><span class="present" [style.width.%]="member.Total ? (member.Hadir / member.Total) * 100 : 0"></span></div><small>{{ member.Hadir }} hadir</small></div></div></section></main></div>
<button type="button" class="btn btn-secondary no-print" (click)="printReport()"><i class="fas fa-print"></i> Cetak Laporan</button>
