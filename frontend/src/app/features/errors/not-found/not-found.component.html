<main class="error-container" aria-labelledby="not-found-title">
  <section class="error-content">
    <div class="error-code" aria-hidden="true">404</div>
    <h1 id="not-found-title">Halaman Tidak Ditemukan</h1>
    <p>Maaf, halaman yang Anda cari tidak ada atau mungkin telah dipindahkan. Periksa kembali alamat URL Anda.</p>
    <div class="error-actions">
      <a [routerLink]="homeLink" class="btn-primary">Kembali ke Beranda</a>
      <a routerLink="/login" class="btn-outline-primary">Ke Halaman Login</a>
    </div>
  </section>
</main>
