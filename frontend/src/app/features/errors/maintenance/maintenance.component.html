<main class="error-container" aria-labelledby="maintenance-title">
  <section class="error-content">
    <span class="error-icon" aria-hidden="true">🛠️</span>
    <h1 id="maintenance-title">Pemeliharaan Sistem</h1>
    <p>Sistem Absensi Golan sedang menjalani pemeliharaan rutin agar tetap aman dan stabil. Silakan coba kembali beberapa saat lagi.</p>
    <div class="error-actions">
      <button type="button" (click)="reload()" class="btn-primary">Coba Lagi</button>
      <a routerLink="/login" class="btn-outline-primary">Ke Halaman Login</a>
    </div>
  </section>
</main>
