<main class="auth-container" aria-labelledby="verify-otp-title">
  <section class="auth-card">
    <div class="auth-brand"><img src="assets/icon_golan.png" alt="Logo Golan Digital Kreatif"><span>GOLAN DIGITAL KREATIF</span></div>
    <div class="brand"><p class="eyebrow">PEMULIHAN AKUN</p><h1 id="verify-otp-title">Verifikasi Kode OTP</h1><p>Kode 6 digit telah dikirim ke <strong>{{ maskedEmail }}</strong>. Kode berlaku {{ countdown }}.</p></div>
    <form (ngSubmit)="verify()" #otpForm="ngForm" novalidate>
      <div class="alert alert-info" *ngIf="developmentOtp">Mode development — OTP: <strong>{{ developmentOtp }}</strong></div>
      <div class="form-group"><label for="otp">Kode OTP</label><input id="otp" name="otp" [(ngModel)]="otp" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" class="form-control otp-input" placeholder="000000"></div>
      <div class="alert alert-success" *ngIf="successMessage" role="status">{{ successMessage }}</div><div class="alert alert-danger" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>
      <button type="submit" [disabled]="otpForm.form.invalid || isLoading" class="btn-primary w-100">{{ isLoading ? 'Memverifikasi...' : 'Verifikasi' }}</button>
      <button type="button" class="btn-link" [disabled]="isResending || secondsLeft > 240" (click)="resend()">{{ isResending ? 'Mengirim...' : (secondsLeft > 240 ? 'Kirim ulang dalam ' + (secondsLeft - 240) + ' detik' : 'Kirim Ulang Kode OTP') }}</button>
      <div class="links mt-3 text-center"><a routerLink="/forgot-password">← Ganti email</a></div>
    </form>
  </section>
</main>
