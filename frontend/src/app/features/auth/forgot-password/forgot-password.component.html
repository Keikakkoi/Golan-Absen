<main class="auth-container" aria-labelledby="forgot-password-title">
  <section class="auth-card">
    <div class="auth-brand">
      <img src="assets/icon_golan.png" alt="Logo Golan Digital Kreatif">
      <span>GOLAN DIGITAL KREATIF</span>
    </div>

    <div class="brand">
      <p class="eyebrow">PEMULIHAN AKUN</p>
      <h1 id="forgot-password-title">Lupa Password?</h1>
      <p>Masukkan email akun Anda. Kode OTP 6 digit akan dikirim untuk memulihkan akun.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required email #emailInput="ngModel" placeholder="nama@perusahaan.com" class="form-control" autocomplete="email">
        <small class="field-error" *ngIf="emailInput.invalid && emailInput.touched">Masukkan alamat email yang valid.</small>
      </div>

      <div class="alert alert-success" *ngIf="successMessage" role="status">{{ successMessage }}</div>
      <div class="alert alert-danger" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

      <button type="submit" [disabled]="!forgotForm.form.valid || isLoading" class="btn-primary w-100 mt-3">
        {{ isLoading ? 'Memproses...' : 'Kirim Kode OTP' }}
      </button>

      <div class="links mt-3 text-center">
        <a routerLink="/login">← Kembali ke Login</a>
      </div>
    </form>
  </section>
</main>
