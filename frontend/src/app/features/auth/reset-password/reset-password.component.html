<main class="auth-container" aria-labelledby="reset-password-title">
  <section class="auth-card">
    <div class="auth-brand">
      <img src="assets/icon_golan.png" alt="Logo Golan Digital Kreatif">
      <span>GOLAN DIGITAL KREATIF</span>
    </div>

    <div class="brand">
      <p class="eyebrow">PEMULIHAN AKUN</p>
      <h1 id="reset-password-title">Reset Password</h1>
      <p>Buat password baru yang kuat untuk mengamankan akun Anda.</p>
    </div>

    <div class="alert alert-danger" *ngIf="!token && errorMessage" role="alert">{{ errorMessage }}</div>
    <a class="btn-outline-primary w-100" routerLink="/forgot-password" *ngIf="!token && errorMessage">Minta Link Reset Baru</a>

    <form (ngSubmit)="onSubmit()" #resetForm="ngForm" *ngIf="!successMessage && token" novalidate>
      <div class="form-group">
        <label for="password">Password Baru</label>
        <input type="password" id="password" name="password" [(ngModel)]="newPassword" required placeholder="Minimal 8 karakter" class="form-control" minlength="8" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Konfirmasi Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required placeholder="Ulangi password baru" class="form-control" minlength="8" autocomplete="new-password">
      </div>

      <div class="alert alert-danger" *ngIf="newPassword && confirmPassword && newPassword !== confirmPassword" role="alert">
        Password tidak cocok.
      </div>
      <div class="alert alert-danger" *ngIf="errorMessage && token && !(newPassword && confirmPassword && newPassword !== confirmPassword)" role="alert">{{ errorMessage }}</div>

      <button type="submit" [disabled]="!resetForm.form.valid || isLoading || newPassword !== confirmPassword" class="btn-primary w-100 mt-3">
        {{ isLoading ? 'Memproses...' : 'Reset Password' }}
      </button>
    </form>

    <div class="reset-success" *ngIf="successMessage">
      <div class="alert alert-success" role="status">{{ successMessage }}</div>
      <a class="btn-primary reset-action" routerLink="/login">Pergi ke Halaman Login</a>
    </div>

    <div class="links mt-3 text-center" *ngIf="!successMessage && token">
      <a routerLink="/login">← Kembali ke Login</a>
    </div>
  </section>
</main>
