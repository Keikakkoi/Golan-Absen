<div class="split-layout">
  <!-- Left Panel: Brand & Info -->
  <div class="brand-panel">
    <span class="ambient-orb orb-one" aria-hidden="true"></span>
    <span class="ambient-orb orb-two" aria-hidden="true"></span>
    <span class="ambient-orb orb-three" aria-hidden="true"></span>
    <div class="falling-stars" aria-hidden="true">
      <span class="falling-star star-one"></span>
      <span class="falling-star star-two"></span>
      <span class="falling-star star-three"></span>
      <span class="falling-star star-four"></span>
      <span class="falling-star star-five"></span>
      <span class="falling-star star-six"></span>
      <span class="falling-star star-seven"></span>
      <span class="falling-star star-eight"></span>
    </div>

    <div class="brand-content">
      <div class="clock-display">
        <h1 class="mono-text">{{ currentTime | date:'HH:mm:ss' }}</h1>
        <p>{{ currentDateLabel }}</p>
      </div>

      <!-- Signature Element: Stempel Bundar Berputar (15.1 PRD) -->
      <div class="stamp-seal-wrapper">
        <div class="stamp-seal">
          <img src="assets/icon_golan.png" alt="Logo Golan Digital Kreatif" class="stamp-logo" />
          <div class="stamp-outer-ring"></div>
          <div class="stamp-inner-ring"></div>
          <div class="stamp-center">
            <div class="stamp-badge">GOLAN DIGITAL KREATIF</div>
            <div class="stamp-sub">VERIFIED • ABSENSI</div>
          </div>
        </div>
      </div>

      <div class="welcome-text">
        <h2>Selamat Datang</h2>
        <p>Absensi Digital PT Digital Golan Kreatif</p>
      </div>
    </div>
  </div>

  <!-- Right Panel: Login Form -->
  <div class="form-panel">
    <div class="login-grid-overlay" aria-hidden="true"></div>
    <div class="login-particles" aria-hidden="true">
      <span *ngFor="let particle of particleIds" class="floating-particle particle-{{ particle }}"></span>
    </div>

    <div class="login-card">
      <div class="brand-header">
        <img src="assets/icon_golan.png" alt="Logo PT. Golan" class="brand-logo" />
        <h2>PT. Golan Digital Kreatif</h2>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="Enter your email"
            autocomplete="username"
            [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Sembunyikan password' : 'Tampilkan password'"
              [attr.aria-pressed]="showPassword"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.1 12s3.3-5.2 9.9-5.2 9.9 5.2 9.9 5.2-3.3 5.2-9.9 5.2S2.1 12 2.1 12Z" />
                <circle cx="12" cy="12" r="2.7" />
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 3 18 18M10.6 6.9A10.8 10.8 0 0 1 12 6.8c6.6 0 9.9 5.2 9.9 5.2a18.6 18.6 0 0 1-3.2 3.6M6.2 6.8C3.6 8.2 2.1 12 2.1 12s3.3 5.2 9.9 5.2c1.1 0 2.1-.2 3-.4" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group math-group">
          <label for="mathAnswer">Verifikasi keamanan</label>
          <div class="math-challenge">
            <span class="math-question" aria-hidden="true">{{ mathQuestion }} =</span>
            <input
              type="number"
              id="mathAnswer"
              formControlName="mathAnswer"
              placeholder="Jawaban"
              inputmode="numeric"
              autocomplete="off"
              [attr.aria-label]="'Jawaban dari ' + mathQuestion"
              [class.is-invalid]="loginForm.get('mathAnswer')?.invalid && loginForm.get('mathAnswer')?.touched"
            />
          </div>
        </div>

        <div class="form-options">
          <a routerLink="/forgot-password">Lupa password?</a>
        </div>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn-primary w-100" [disabled]="loginForm.invalid || isLoading">
          {{ isLoading ? 'Authenticating...' : 'Sign In' }}
        </button>
      </form>
    </div>
  </div>
</div>
