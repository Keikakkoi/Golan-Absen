<div class="dashboard-container"><app-shared-sidebar></app-shared-sidebar><main class="main-content"><div class="header"><h2>Sertifikat Magang</h2><p>Sertifikat aktif otomatis setelah periode magang berakhir.</p></div><section class="golan-card certificate-card"><div *ngIf="error" class="alert alert-danger">{{ error }}</div><ng-container *ngIf="certificate"><h3>Sertifikat tersedia</h3><p>Nomor sertifikat: <strong>{{ certificate.certificate_no }}</strong></p><p class="muted">Diterbitkan {{ certificate.issued_at | date:'dd MMM yyyy' }}</p><button class="btn-primary" (click)="download()">Download PDF</button></ng-container><p *ngIf="!certificate && !error" class="muted">Memuat status sertifikat...</p></section></main></div>
