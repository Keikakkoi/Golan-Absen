<div class="dashboard-container"><app-shared-sidebar></app-shared-sidebar><main class="main-content"><div class="header"><h2>Statistik Kehadiran</h2><p>Ringkasan sederhana kehadiran selama periode magang.</p></div><section class="golan-card report-toolbar"><label>Mulai<input class="golan-input" type="date" [(ngModel)]="start"></label><label>Selesai<input class="golan-input" type="date" [(ngModel)]="end"></label><button type="button" class="btn-primary report-filter-action" (click)="load()">Filter</button><div class="export-dropdown" style="position: relative;"><button type="button" class="btn btn-secondary" (click)="toggleExportDropdown()"><i class="fas fa-file-export" style="margin-right: 0.5rem;"></i> Unduh / Cetak <i class="fas fa-chevron-down" style="margin-left: 0.5rem; font-size: 0.8rem;"></i></button><div class="dropdown-menu-custom" *ngIf="isExportOpen"><button type="button" class="dropdown-item" (click)="exportCSV()"><i class="fas fa-file-csv" style="color: #17a2b8; margin-right: 0.5rem; width: 16px;"></i> Format CSV</button><button type="button" class="dropdown-item" (click)="exportExcel()"><i class="fas fa-file-excel" style="color: #28a745; margin-right: 0.5rem; width: 16px;"></i> Format Excel (XLS)</button><button type="button" class="dropdown-item" (click)="exportJSON()"><i class="fas fa-file-code" style="color: #ffc107; margin-right: 0.5rem; width: 16px;"></i> Format JSON</button><button type="button" class="dropdown-item" (click)="exportPDF()"><i class="fas fa-file-pdf" style="color: #dc3545; margin-right: 0.5rem; width: 16px;"></i> Format PDF</button></div></div></section><div class="stats-grid"><section class="golan-card stat-card"><h4>Hadir</h4><div class="value">{{ stats.hadir }} <span class="unit">hari</span></div></section><section class="golan-card stat-card"><h4>Izin Disetujui</h4><div class="value">{{ stats.izin_disetujui }} <span class="unit">pengajuan</span></div></section></div></main></div>
