<div class="dashboard-container"><app-shared-sidebar></app-shared-sidebar><main class="main-content"><div class="header"><h2>Statistik Kehadiran</h2><p>Ringkasan sederhana kehadiran selama periode magang.</p></div><section class="golan-card report-toolbar"><label>Mulai<input class="golan-input" type="date" [(ngModel)]="start"></label><label>Selesai<input class="golan-input" type="date" [(ngModel)]="end"></label><button type="button" class="btn-primary report-filter-action" (click)="load()">Filter</button></section><div class="stats-grid"><section class="golan-card stat-card"><h4>Hadir</h4><div class="value">{{ stats.hadir }} <span class="unit">hari</span></div></section><section class="golan-card stat-card"><h4>Izin Disetujui</h4><div class="value">{{ stats.izin_disetujui }} <span class="unit">pengajuan</span></div></section></div></main></div>
